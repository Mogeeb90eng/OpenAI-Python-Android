plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.mogeeb.openaiandroid'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mogeeb.openaiandroid'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        pip {
            options('--find-links', file("$projectDir/../wheels").absolutePath)
            install('openai==3.3.0')
        }
    }
}
